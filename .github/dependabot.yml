version: 2

updates:
  # Keeps the SHA-pinned actions (and their version comments) current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']

  # One PR per month for minor/patch updates; each major version arrives as its own PR.
  - package-ecosystem: npm
    directory: /projects/web-e2e
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # @types/node follows the Node.js major that CI runs (setup-node `node-version`), not the latest
      # Node.js release; bump it together with that version.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
