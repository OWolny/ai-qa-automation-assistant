name: web-e2e

# Pushes to main and pull requests reach this workflow through ci.yml, which calls it only when this
# project changed. Run it by hand (workflow_dispatch) to regenerate the visual baselines.
on:
  workflow_call:
    inputs:
      update_snapshots:
        description: Regenerate visual baselines and upload them as an artifact
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: Regenerate visual baselines and upload them as an artifact
        type: boolean
        default: false

permissions:
  contents: read

# Called from ci.yml, github.* describes the caller's run; the group name differs from ci.yml's so the
# two never wait on each other.
concurrency:
  group: web-e2e-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: projects/web-e2e

env:
  CI: '1'
  PW_INCLUDE_WEBKIT: '1'

jobs:
  # Cheap checks first: no browsers, so a type or lint error fails in about a minute.
  static:
    name: typecheck + lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projects/web-e2e/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

  test:
    name: test (shard ${{ matrix.shard }}/2)
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projects/web-e2e/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Run tests
        env:
          UPDATE_SNAPSHOTS: ${{ inputs.update_snapshots }}
          SHARD: ${{ matrix.shard }}
        run: |
          if [ "$UPDATE_SNAPSHOTS" = "true" ]; then
            npx playwright test --grep @visual --update-snapshots --shard="$SHARD/2"
          else
            npx playwright test --shard="$SHARD/2"
          fi
      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: blob-report-${{ matrix.shard }}
          path: projects/web-e2e/blob-report
          retention-days: 7
      - name: Upload test results (traces, screenshots, actual snapshots)
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-${{ matrix.shard }}
          path: projects/web-e2e/test-results
          retention-days: 7
      - name: Upload regenerated visual baselines
        if: ${{ !cancelled() && inputs.update_snapshots }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual-baselines-${{ matrix.shard }}
          path: projects/web-e2e/tests/**/*-snapshots/
          if-no-files-found: ignore
          retention-days: 7

  report:
    name: merge reports
    # Skipped tests (a failed static job) leave nothing to merge.
    if: ${{ !cancelled() && needs.test.result != 'skipped' }}
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # read artifacts of earlier runs to restore the dashboard history
    env:
      HISTORY_ARTIFACT: business-report-history
      # Only full-suite runs on main extend the history; PRs and dispatches only display it.
      RECORD_ELIGIBLE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && '1' || '0' }}
      # Keep in sync with the test job's shard matrix: a run with a missing shard is not recorded.
      EXPECTED_SHARDS: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projects/web-e2e/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: projects/web-e2e/all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      # History lives in the newest unexpired artifact uploaded by a run on main (kept 90 days). No artifact
      # starts a new history; an API or download error only turns recording off, so a transient failure can
      # never replace a long history with a one-run one.
      - name: Restore dashboard history
        if: ${{ !inputs.update_snapshots }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          record="$RECORD_ELIGIBLE"
          blobs=$(find all-blob-reports -name '*.zip' | wc -l)
          if [ "$blobs" -ne "$EXPECTED_SHARDS" ]; then
            echo "::warning::Found $blobs of $EXPECTED_SHARDS shard reports; this run is not recorded in the dashboard history."
            record=0
          fi
          mkdir -p business-report-history
          if ! run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$HISTORY_ARTIFACT&per_page=50" \
              --jq '[.artifacts[] | select(.expired | not) | select(.workflow_run.head_branch == "main")][0].workflow_run.id // empty'); then
            echo "::warning::Could not look up the dashboard history; this run is not recorded."
            record=0
          elif [ -z "$run_id" ]; then
            echo "No earlier dashboard history found; starting a new one."
          elif gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "$HISTORY_ARTIFACT" --dir business-report-history; then
            echo "Restored dashboard history from run $run_id ($(find business-report-history -name '*.json' | wc -l) runs)."
          else
            echo "::warning::Could not download the dashboard history from run $run_id; this run is not recorded."
            record=0
          fi
          echo "BUSINESS_REPORT_RECORD_HISTORY=$record" >> "$GITHUB_ENV"
      - name: Merge reports (HTML report + Business QA Dashboard)
        id: merge
        env:
          # On pull requests GITHUB_SHA is a temporary merge commit; report the PR head instead.
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npx playwright merge-reports --config merge.config.ts ./all-blob-reports
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: projects/web-e2e/playwright-report
          retention-days: 14
          overwrite: true
      - name: Upload Business QA Dashboard
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: business-report
          path: projects/web-e2e/business-report
          retention-days: 14
          overwrite: true
      - name: Save dashboard history
        if: ${{ env.BUSINESS_REPORT_RECORD_HISTORY == '1' && steps.merge.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.HISTORY_ARTIFACT }}
          path: projects/web-e2e/business-report-history
          retention-days: 90
          overwrite: true
