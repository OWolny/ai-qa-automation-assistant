name: web-e2e

on:
  push:
    branches: [main]
    paths: ['projects/web-e2e/**', '.github/workflows/web-e2e.yml']
  pull_request:
    paths: ['projects/web-e2e/**', '.github/workflows/web-e2e.yml']
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: Regenerate visual baselines and upload them as an artifact
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: web-e2e-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: projects/web-e2e

env:
  CI: '1'
  PW_INCLUDE_WEBKIT: '1'

jobs:
  test:
    name: test (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projects/web-e2e/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run typecheck
      - name: Run tests
        run: |
          if [ "${{ inputs.update_snapshots }}" = "true" ]; then
            npx playwright test --grep @visual --update-snapshots --shard=${{ matrix.shard }}/2
          else
            npx playwright test --shard=${{ matrix.shard }}/2
          fi
      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: projects/web-e2e/blob-report
          retention-days: 7
      - name: Upload test results (traces, screenshots, actual snapshots)
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.shard }}
          path: projects/web-e2e/test-results
          retention-days: 7
      - name: Upload regenerated visual baselines
        if: ${{ !cancelled() && inputs.update_snapshots }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines-${{ matrix.shard }}
          path: projects/web-e2e/tests/**/*-snapshots/
          if-no-files-found: ignore
          retention-days: 7

  report:
    name: merge reports
    if: ${{ !cancelled() }}
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projects/web-e2e/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          path: projects/web-e2e/all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - run: npx playwright merge-reports --reporter html ./all-blob-reports
      - uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: projects/web-e2e/playwright-report
          retention-days: 14
